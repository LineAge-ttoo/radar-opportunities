name: RADAR Live Auto-Scanner (Every 6 Hours)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-opportunity-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Live Multi-Source Opportunity Scan
        run: |
          python scripts/run_radar_scan.py
          cp app/index.html index.html
          cp app/manifest.json manifest.json
          cp app/latest_scan.json latest_scan.json

      - name: Commit & Push Fresh Opportunities to Main (Auto-Deploys Pages & Vercel)
        run: |
          git config user.name "RADAR Auto-Scanner"
          git config user.email "radar-bot@users.noreply.github.com"
          git add latest_scan.json app/latest_scan.json data/opportunities/latest_scan.json exports/ || true
          git diff --staged --quiet || (git commit -m "chore(scan): automated live opportunity refresh" && git push)

name: "que hay pa hacer! — Auto-Update Diario Multi-Horario (San Agustín Huila & Colombia)"

on:
  schedule:
    - cron: '0 */4 * * *' # Se ejecuta automáticamente 6 veces al día (cada 4 horas)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run San Agustín Huila, Guadua, SECOP II & Colombia Live Scan
        run: python scripts/run_radar_scan.py

      - name: Sync Web & Portable App
        run: |
          python -c "import shutil, json; shutil.copy('app/index.html', 'index.html'); html = open('app/index.html', encoding='utf-8').read(); data = json.load(open('app/latest_scan.json', encoding='utf-8')); portable = html.replace('</head>', '<script>window.__RADAR_EMBEDDED_DATA__ = ' + json.dumps(data.get('opportunities', []), ensure_ascii=False) + ';</script>\n</head>'); open('exports/RADAR_Portable_Safari.html', 'w', encoding='utf-8').write(portable)"

      - name: Commit and Push Live Updates
        run: |
          git config user.name "que-hay-pa-hacer-bot"
          git config user.email "bot@radar-colombia.local"
          git add data/opportunities/latest_scan.json data/opportunities/whatsapp_alert_3222739034.json app/latest_scan.json latest_scan.json exports/
          git diff --staged --quiet || git commit -m "chore(auto-scan): actualizacion diaria multi-horario San Agustin Huila, Guadua, Estudiantes y Colombia"
          git push
